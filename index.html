<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Month at a Glance</title>
<script>
  try {
    if (localStorage.getItem("plan-calendar.theme") === "light") {
      document.documentElement.dataset.theme = "light";
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="titles">
      <h1 class="brand">Month at a Glance</h1>
      <p class="tagline">See what's ahead, plan the whole month in one look</p>
    </div>
    <button class="pill-btn theme-btn" id="themeBtn" aria-label="Switch color theme">&#9728; Light</button>
  </header>

  <div class="content">
    <section class="cal">
      <header class="bar">
        <h2 class="month-title" id="title">—</h2>
        <div class="bar-right">
          <button class="icon-btn" id="prev" aria-label="Previous month">&#8249;</button>
          <button class="icon-btn" id="next" aria-label="Next month">&#8250;</button>
          <button class="pill-btn" id="today">Today</button>
        </div>
      </header>

      <div class="dow" id="dow"></div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="panel">
      <h2 id="panelTitle">—</h2>
      <form id="addForm" autocomplete="off">
        <input id="taskInput" type="text" maxlength="80" placeholder="Add a task, press Enter" />
      </form>
      <ul class="tasks" id="tasks"></ul>
    </aside>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
